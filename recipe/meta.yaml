{% set name = "ozzy-pic" %}
{% set version = "2.1.7" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ozzy_pic-{{ version }}.tar.gz
  sha256: a42c9600ce3c5aacd64a2a384067c337d53d69e1127859a3517ddc5d15d46dc1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<3.15
    - xarray >=2026.7.0,<2027.0.0
    - tqdm >=4.68.4,<5.0.0
    - numba >=0.65,<1.0
    - h5py >=3.14.0,<4.0.0
    - h5netcdf >=1.6.1,<2.0.0
    - flox >=0.11.2,<0.12.0
    - dask-core >=2026.7.1,<2027.0.0
    - dask-expr >=2.0.0,<3.0.0
    - matplotlib-base >=3.10.3,<4.0.0
    - cmcrameri
    - seaborn >=0.13.2,<0.14.0
    - numbagg >=0.9.4,<0.10.0
    - pyarrow >=24.0.0,<26.0.0
    - hvplot >=0.12.2,<1.0
    - ipython >=8.39.0,<10.0
    - openpmd-viewer >=1.11.0,<2.0.0
    - pint >=0.25.3,<0.26.0
    - tol-colors >=2.2.0,<3.0.0
  run_constrained:
    - numpy-groupies >=0.11.3,<0.12.0

test:
  imports:
    - ozzy
    - ozzy.plot
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://mtrocadomoreira.github.io/ozzy/
  summary: PIC simulation data analysis for the lazy and impatient
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mtrocadomoreira
